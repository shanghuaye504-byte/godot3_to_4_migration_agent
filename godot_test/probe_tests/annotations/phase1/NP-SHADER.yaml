  - id: SH-GOOD
    file: good.gdshader
    intent: 同项目内正确 shader 对照，用来区分“这个 shader 坏”与“任何 shader 都不报”
    expect_silent: true
  - id: SH-MAIN
    file: main.gd
    intent: 主场景脚本对照
    expect_silent: true
