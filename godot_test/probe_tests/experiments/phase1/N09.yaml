# experiments/phase1/N09.yaml
#
# Determinism & Cross-Fixture Calibration。YAML 只描述采集矩阵并选型
# analysis.type: stability。
#
# V1 即项目级编译校验：kernel 前置写入哨兵、结束后删除，步骤不必写 hook。
# clean-control：COLD V1 → V2(main.gd) → V3；WARM V1、V2(main.gd)、V3、V5
# np-cascade：COLD V3；WARM V1、V2(dep_1.gd)、V3

id: N09
phase: phase1
repeat: 5
timeout_seconds: 30

analysis:
  type: stability

groups:
  - group_id: clean-control
    fixture: phase1/CleanControl
    steps:
      - step_id: v1-cold
        command: V1
        cache_state: COLD
      - step_id: v2-cold
        command: V2
        cache_state: COLD
        script: main.gd
      - step_id: v3-cold
        command: V3
        cache_state: COLD
      - step_id: v1-warm
        command: V1
        cache_state: WARM
      - step_id: v2-warm
        command: V2
        cache_state: WARM
        script: main.gd
      - step_id: v3-warm
        command: V3
        cache_state: WARM
      - step_id: v5-warm
        command: V5
        cache_state: WARM
        timeout_seconds: 10

  - group_id: np-cascade
    fixture: phase1/NP-CASCADE
    steps:
      - step_id: v3-cold
        command: V3
        cache_state: COLD
      - step_id: v1-warm
        command: V1
        cache_state: WARM
      - step_id: v2-warm
        command: V2
        cache_state: WARM
        script: dep_1.gd
      - step_id: v3-warm
        command: V3
        cache_state: WARM
