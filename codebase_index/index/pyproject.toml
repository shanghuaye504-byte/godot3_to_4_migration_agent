[project]
name = "codeindex"
version = "0.1.0"
description = "Godot 项目符号索引：常驻 daemon（唯一写者）+ 无状态 CLI（只读）"
readme = "README.md"
requires-python = ">=3.11"
# 运行期依赖：下游把本子模块当包引用时只会带上这些
dependencies = [
    "watchfiles>=0.21",
    "tree-sitter>=0.23",
    # GDScript 没有独立 PyPI wheel（tree-sitter-gdscript 只发 npm/crates）。
    # language-pack 内置 PrestonKnopp/tree-sitter-gdscript，并覆盖 csharp/cpp，
    # 三种语言统一从这里取 Language，避免混装官方 wheel 带来的 ABI 冲突。
    "tree-sitter-language-pack>=1.9",
    "pyyaml>=6.0",
]

[dependency-groups]
# build/dev/test 类依赖只放这里，禁止用 [project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeindex"]

[project.scripts]
codeindex = "codeindex.cli:main"
codeindexd = "codeindex.daemon:main"
