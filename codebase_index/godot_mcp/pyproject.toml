[project]
name = "godot-mcp"
version = "0.1.0"
description = "Layer 3：自建 Godot MCP server —— 仅暴露 verify 工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 官方 MCP Python SDK
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]

[project.scripts]
godot-mcp = "godot_mcp.server:main"
