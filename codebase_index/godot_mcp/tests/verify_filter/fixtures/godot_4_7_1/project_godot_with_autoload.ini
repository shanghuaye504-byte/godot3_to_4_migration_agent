; 供 test_autoload_keys.py 使用的 [autoload] 段样例。
; DummySingleton 的值是 uid://，Config 的值是 res://——故意混用两种格式，
; 这正是 autoload.py 不能断言值必须是 res:// 的证据（N02 derived patch 实测值）。

[application]

config/name="NP-ADDON"

[autoload]

Config="*res://config.gd"
DummySingleton="*uid://qmfp8cu17gl2"

[editor_plugins]

enabled=PackedStringArray("res://addons/dummy/plugin.cfg")
