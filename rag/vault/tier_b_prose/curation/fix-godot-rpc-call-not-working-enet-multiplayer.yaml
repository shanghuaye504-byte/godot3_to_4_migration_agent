excerpts:
  - heading_path:
      - The @rpc Annotation
    text: |
      In Godot 4, the @rpc annotation replaced the old remote, puppet, and master
      keywords. If your function doesn't have an @rpc annotation, calling .rpc()
      on it will silently do nothing. There is no runtime error or warning — the
      call is simply discarded. The same silent drop happens if a non-authority
      peer tries to call an "authority" RPC.
    code: |
      @rpc("any_peer", "reliable", "call_local")
      func take_damage(amount: int):
          health -= amount
    language: gdscript
