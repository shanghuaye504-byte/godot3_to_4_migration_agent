  - create_tween
  - interpolate_property
excerpts:
  - heading_path:
      - Tweens
    text: |
      Tweens are not nodes anymore. They are references, similar to timers you
      create with the scene tree. You create one with get_tree().create_tween()
      (or create_tween() on a Node, which binds the tween to that node). There
      is also tween_interval (wait), tween_callback (old interpolate_callback),
      and tween_method (old interpolate_method). You can stop/reset, pause,
      resume, or destroy a tween; a tween bound to a node will not process if
      the node is outside the tree or paused.
    code: |
      var sprite = $Sprite
      var tween := get_tree().create_tween()
      tween.tween_property(sprite, "position", sprite.position + Vector2(16.0, 16.0), 1.0)
    language: gdscript
