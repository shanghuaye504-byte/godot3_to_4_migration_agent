[build]
# setuptools 的 PEP517 打包流程默认会把临时脚手架文件写到项目根目录下一个叫
# `build/` 的目录里——但我们自己的 `rag/build/`（adapter 脚本）已经占用了这个
# 名字。不重定向的话，每次 `uv build --wheel` / `pip install .` 都会把
# `bdist.*/`、`lib/` 这些临时产物拷进 `rag/build/`，和真正的 parser 脚本混在
# 一起。这里把 setuptools 的脚手架目录改名到 `.setuptools-build/`（已在根
# .gitignore 里排除），避免这个命名冲突。
build-base = .setuptools-build
