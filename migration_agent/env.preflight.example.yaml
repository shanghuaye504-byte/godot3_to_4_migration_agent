# S00 预检示例。相对路径相对仓库根，不相对启动目录。
# 未设置 GODOT_BINARY 时使用探针实验里的 /usr/local/bin/godot4。
# 本文件只描述格式。offline 不连接观测后端。

profile: offline
godot_binary: ${GODOT_BINARY}
rules_manifest: rag/artifacts/manifest.lock.json
rules_db: rag/artifacts/rules.db
corpus_dir: rag/artifacts/corpora/default/corpus.lance
otel:
  protocol: http/protobuf
  semantic_conventions_version: "1.37.0"
